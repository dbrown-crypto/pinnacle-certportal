<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pinnacle — Certificate Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--navy:#11243F;--navy-deep:#0E1E36;--gold:#C9A94E;--gold-dark:#A1832F;
    --cream:#FBF8F1;--cream-2:#F5F0E4;--ink:#15263F;--slate:#3F4754;--line:#e3dcc9;
    --ok:#2f7d52;--warn:#9a6b16;--stop:#9a3434}
  *{box-sizing:border-box}
  body{margin:0;font-family:Raleway,system-ui,sans-serif;color:var(--ink);background:var(--cream-2)}
  header{background:var(--navy);color:var(--cream);padding:14px 22px;display:fhlex;align-items:center;justify-content:space-between}
  header h1{font-family:"Playfair Display",serif;font-size:18px;margin:0}
  header .who{font-size:12px;color:rgba(251,248,241,.7)}
  .link{background:none;border:0;color:var(--gold);cursor:pointer;font:inherit;text-decoration:underline}
  .wrap{max-width:1000px;margin:0 auto;padding:22px 18px 60px}
  .tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
  .tab{padding:9px 16px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px}
  .tab.active{background:var(--navy);color:var(--cream);border-color:var(--navy)}
  .panel{display:none}.panel.show{display:block}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:12px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--slate);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
  .pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px}
  .pill.active{background:#e7f1ea;color:var(--ok)}.pill.off{background:#f1e7e7;color:var(--stop)}
  .pill.open{background:#fbf3e2;color:var(--warn)}.pill.sent{background:#e7f1ea;color:var(--ok)}
  .pill.block{background:#f1e7e7;color:var(--stop)}.pill.route_to_agent{background:#fbf3e2;color:var(--warn)}
  .pill.auto_issue{background:#e7f1ea;color:var(--ok)}
  button.act{border:0;border-radius:7px;padding:7px 12px;font:inherit;font-weight:600;font-size:12px;cursor:pointer;margin:2px}
  .b-navy{background:var(--navy);color:var(--cream)}.b-gold{background:var(--gold);color:var(--navy)}
  .b-stop{background:#f1e7e7;color:var(--stop)}.b-ghost{background:#fff;border:1px solid var(--line)!important;color:var(--slate)}
  label{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--slate);display:block;margin:8px 0 4px}
  input,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font:inherit;background:var(--cream)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:640px){.grid{grid-template-columns:1fr}}
  .login{max-width:360px;margin:60px auto;background:#fff;border-radius:12px;padding:26px;box-shadow:0 14px 40px rgba(0,0,0,.18)}
  .login h2{font-family:"Playfair Display",serif;margin:0 0 14px}
  .hidden{display:none}.muted{color:var(--slate);font-size:12px}
  .err{color:var(--stop);font-size:13px;margin-top:8px}
</style>
</head>
<body>

<div id="loginView" class="login">
  <h2>Certificate Admin</h2>
  <label>Email</label><input id="aEmail" type="email"/>
  <label>Password</label><input id="aPass" type="password"/>
  <button class="act b-navy" style="margin-top:14px;width:100%" id="aLogin">Sign in</button>
  <div id="aErr" class="err"></div>
</div>

<div id="appView" class="hidden">
  <header>
    <h1>Pinnacle — Certificate Admin</h1>
    <div><span class="who" id="aWho"></span> · <button class="link" id="aLogout">Sign out</button></div>
  </header>
  <div class="wrap">
    <div class="tabs">
      <div class="tab active" data-p="policies">Policies</div>
      <div class="tab" data-p="queue">Special Requests <span id="queueCount"></span></div>
      <div class="tab" data-p="certs">Issued Certificates</div>
      <div class="tab" data-p="audit">Audit Log</div>
    </div>

    <!-- POLICIES -->
    <div class="panel show" id="p-policies">
      <div class="card">
        <strong>Add / edit a policy</strong>
        <div class="muted">Keyed by hand — this is the source of truth the portal reads. Keep <em>data current as of</em> honest.</div>
        <div class="grid" style="margin-top:10px">
          <div><label>Client ID (auth user id)</label><input id="f_client"/></div>
          <div><label>Named insured</label><input id="f_insured"/></div>
          <div><label>USDOT</label><input id="f_dot"/></div>
          <div><label>Status</label><input id="f_status" value="active" placeholder="active / cancelled / pending"/></div>
          <div><label>Effective date</label><input id="f_eff" type="date"/></div>
          <div><label>Expiration date</label><input id="f_exp" type="date"/></div>
          <div><label>Insured address</label><input id="f_addr"/></div>
          <div><label>Data current as of</label><input id="f_asof" type="date"/></div>
        </div>
        <label>Producer block (prints on cert)</label><textarea id="f_producer">Pinnacle Risk Advisors LLC
2700 Cumberland Pkwy SE, Ste 410, Atlanta, GA 30339
(943) 239-3439  dbrown@pinnacleriskad.com</textarea>
        <label>Coverages (JSON: line → limit)</label><input id="f_cov" value='{"auto_liability":1000000,"cargo":100000}'/>
        <label>Carriers (JSON array for cert table)</label><textarea id="f_carriers">[{"line":"Auto Liability","carrier":"Progressive Mountain","policy_number":"","eff":"","exp":"","limits":{"CSL":1000000}}]</textarea>
        <input id="f_id" type="hidden"/>
        <button class="act b-gold" id="savePolicy" style="margin-top:10px">Save policy</button>
        <button class="act b-ghost" id="clearForm">Clear</button>
        <div id="polErr" class="err"></div>
      </div>
      <div class="card"><table id="polTable"></table></div>
    </div>

    <!-- QUEUE -->
    <div class="panel" id="p-queue"><div class="card"><table id="queueTable"></table></div></div>
    <!-- CERTS -->
    <div class="panel" id="p-certs"><div class="card"><table id="certTable"></table></div></div>
    <!-- AUDIT -->
    <div class="panel" id="p-audit"><div class="card"><table id="auditTable"></table></div></div>
  </div>
</div>

<script>
// ---- CONFIG ----
const SUPABASE_URL = "https://dvjnnhwuamwcvqoxmske.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR2am5uaHd1YW13Y3Zxb3htc2tlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxNzU1NzgsImV4cCI6MjA5Nzc1MTU3OH0.StKXBidLUrAQc_q4qMARAGA8Rbpf8ht9vwGvmCOvuLo";
const BACKEND_URL = "https://pinnacle-certportal.onrender.com";
// ----------------
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
let token = null;

async function api(path, opts={}){
  const r = await fetch(BACKEND_URL+path, {...opts,
    headers:{"Content-Type":"application/json","Authorization":"Bearer "+token, ...(opts.headers||{})}});
  if(!r.ok){ throw new Error((await r.json().catch(()=>({}))).detail || r.statusText); }
  return r.json();
}

$("aLogin").onclick = async ()=>{
  const {data,error} = await sb.auth.signInWithPassword({email:$("aEmail").value.trim(),password:$("aPass").value});
  if(error){ $("aErr").textContent="Sign-in failed."; return; }
  token = data.session.access_token; await boot();
};
$("aLogout").onclick = async ()=>{ await sb.auth.signOut(); location.reload(); };

document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  document.querySelectorAll(".panel").forEach(x=>x.classList.remove("show"));
  t.classList.add("active"); $("p-"+t.dataset.p).classList.add("show");
  if(t.dataset.p==="queue") loadQueue();
  if(t.dataset.p==="certs") loadCerts();
  if(t.dataset.p==="audit") loadAudit();
});

async function boot(){
  const {data:{user}} = await sb.auth.getUser();
  if(!user){ return; }
  $("aWho").textContent = user.email;
  $("loginView").classList.add("hidden"); $("appView").classList.remove("hidden");
  try{ await loadPolicies(); await loadQueue(); }
  catch(e){ $("polErr").textContent = "You're signed in but not on the admin allowlist. Add your user id to ADMIN_USER_IDS."; }
}

function esc(s){return (s??"").toString().replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]))}

async function loadPolicies(){
  const rows = await api("/admin/policies");
  $("polTable").innerHTML = "<tr><th>Insured</th><th>DOT</th><th>Term</th><th>Status</th><th>Self-serve</th><th>As of</th><th></th></tr>" +
    rows.map(p=>`<tr>
      <td><strong>${esc(p.named_insured)}</strong></td>
      <td>${esc(p.usdot||"—")}</td>
      <td>${p.effective_date}→${p.expiration_date}</td>
      <td><span class="pill ${p.status==='active'?'active':'off'}">${p.status}</span></td>
      <td><span class="pill ${p.self_serve_enabled?'active':'off'}">${p.self_serve_enabled?'On':'Off'}</span></td>
      <td>${p.data_current_as_of}</td>
      <td>
        <button class="act b-ghost" onclick='editPolicy(${JSON.stringify(p)})'>Edit</button>
        <button class="act ${p.self_serve_enabled?'b-stop':'b-gold'}" onclick="toggleServe('${p.id}',${!p.self_serve_enabled})">${p.self_serve_enabled?'Kill switch':'Re-enable'}</button>
        ${p.status==='active'?`<button class="act b-stop" onclick="setStatus('${p.id}','cancelled')">Mark cancelled</button>`:`<button class="act b-gold" onclick="setStatus('${p.id}','active')">Mark active</button>`}
      </td></tr>`).join("");
}
window.editPolicy = (p)=>{
  $("f_id").value=p.id; $("f_client").value=p.client_id; $("f_insured").value=p.named_insured;
  $("f_dot").value=p.usdot||""; $("f_status").value=p.status; $("f_eff").value=p.effective_date;
  $("f_exp").value=p.expiration_date; $("f_addr").value=p.insured_address; $("f_asof").value=p.data_current_as_of;
  $("f_producer").value=p.producer_block; $("f_cov").value=JSON.stringify(p.coverages);
  $("f_carriers").value=JSON.stringify(p.carriers,null,0); window.scrollTo({top:0,behavior:"smooth"});
};
$("clearForm").onclick=()=>{ ["f_id","f_client","f_insured","f_dot","f_addr"].forEach(i=>$(i).value=""); };
$("savePolicy").onclick = async ()=>{
  $("polErr").textContent="";
  try{
    const body={ client_id:$("f_client").value.trim(), named_insured:$("f_insured").value.trim(),
      usdot:$("f_dot").value.trim()||null, status:$("f_status").value.trim(),
      effective_date:$("f_eff").value, expiration_date:$("f_exp").value,
      producer_block:$("f_producer").value, insured_address:$("f_addr").value.trim(),
      data_current_as_of:$("f_asof").value,
      coverages:JSON.parse($("f_cov").value||"{}"), carriers:JSON.parse($("f_carriers").value||"[]") };
    if($("f_id").value) body.id=$("f_id").value;
    await api("/admin/policies",{method:"POST",body:JSON.stringify(body)});
    $("clearForm").click(); await loadPolicies();
  }catch(e){ $("polErr").textContent="Save failed: "+e.message; }
};
window.toggleServe=async(id,on)=>{ await api(`/admin/policies/${id}/status`,{method:"POST",body:JSON.stringify({self_serve_enabled:on})}); loadPolicies(); };
window.setStatus=async(id,s)=>{ await api(`/admin/policies/${id}/status`,{method:"POST",body:JSON.stringify({status:s})}); loadPolicies(); };

async function loadQueue(){
  const rows = await api("/admin/special-requests");
  const open = rows.filter(r=>r.status==='open').length;
  $("queueCount").textContent = open?`(${open})`:"";
  $("queueTable").innerHTML = "<tr><th>When</th><th>Holder</th><th>Wording</th><th>Status</th><th></th></tr>" +
    rows.map(r=>`<tr>
      <td>${new Date(r.created_at).toLocaleString()}</td>
      <td><strong>${esc(r.holder_name)}</strong><br><span class="muted">${esc(r.holder_address)}</span></td>
      <td>${(r.requested_wording||[]).join(", ")}</td>
      <td><span class="pill ${r.status==='open'?'open':'sent'}">${r.status}</span></td>
      <td>${r.status==='open'?`<button class="act b-gold" onclick="reqStatus('${r.id}','sent')">Mark sent</button>
           <button class="act b-ghost" onclick="reqStatus('${r.id}','in_progress')">In progress</button>`:''}</td>
    </tr>`).join("") || "<tr><td class='muted'>No special-wording requests. Nothing waiting on you.</td></tr>";
}
window.reqStatus=async(id,s)=>{ await api(`/admin/special-requests/${id}/status`,{method:"POST",body:JSON.stringify({status:s})}); loadQueue(); };

async function loadCerts(){
  const rows = await api("/admin/certificates");
  $("certTable").innerHTML = "<tr><th>Issued</th><th>Cert #</th><th>Holder</th><th>By</th></tr>" +
    rows.map(r=>`<tr><td>${new Date(r.issued_at).toLocaleString()}</td><td>${esc(r.cert_number)}</td>
      <td>${esc(r.holder_name)}</td><td>${esc(r.issued_by)}</td></tr>`).join("") ||
      "<tr><td class='muted'>No certificates issued yet.</td></tr>";
}
async function loadAudit(){
  const rows = await api("/admin/audit");
  $("auditTable").innerHTML = "<tr><th>When</th><th>Route</th><th>Holder</th><th>Codes</th></tr>" +
    rows.map(r=>`<tr><td>${new Date(r.occurred_at).toLocaleString()}</td>
      <td><span class="pill ${r.action}">${r.action}</span></td>
      <td>${esc(r.holder_name||"—")}</td>
      <td class="muted">${(r.audit_codes||[]).join(", ")}</td></tr>`).join("") ||
      "<tr><td class='muted'>No activity yet.</td></tr>";
}

// keep session across refresh
sb.auth.getSession().then(({data})=>{ if(data.session){ token=data.session.access_token; boot(); }});
</script>
</body>
</html>
